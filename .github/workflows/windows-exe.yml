name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-exe.yml'
      - 'packaging/**'
      - 'desktop_launcher.py'
      - 'desktop_runtime.py'
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test source
        run: python tools/ci_tests.py
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed' }
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
      - name: Build and test real Windows EXE
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TOShDOTAU-Windows
          path: |
            dist/TOShDOTAU-Setup.exe
            dist/TOShDOTAU-Windows.zip
            dist/SHA256SUMS.txt
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='windows-${{ github.run_number }}'
          gh release create $tag dist/TOShDOTAU-Setup.exe dist/TOShDOTAU-Windows.zip dist/SHA256SUMS.txt --target '${{ github.sha }}' --title 'TOShDOTAU — Windows ilovasi' --notes 'Windows 10/11 x64. Python ichiga kiritilgan. Setup.exe faylini oching. Ilova hali raqamli imzolanmagan. EXE_BOSHLASH.md yorignomasiga qarang.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
