name: Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and unit tests
        run: gradle -p android testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee android/build.log
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: set -o pipefail; gradle -p android connectedDebugAndroidTest --stacktrace 2>&1 | tee android/emulator.log
      - name: Failure diagnostics
        if: failure()
        run: python android/ci_diagnostics.py
      - name: Save tested unsigned build
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/dist/TOShDOTAU-TV-unsigned.apk
          cd android/dist
          zip TOShDOTAU-TV-build.zip TOShDOTAU-TV-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TOShDOTAU-TV-build
          path: android/dist/TOShDOTAU-TV-build.zip
      - name: Publish build for private signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'android-build-${{ github.run_number }}' android/dist/TOShDOTAU-TV-build.zip --target '${{ github.sha }}' --title 'Android TV build for signing' --notes 'Tested unsigned build. User-installable signed APK is distributed separately in downloads/TOShDOTAU-TV.apk. This build ZIP is not the installable download.' --prerelease --latest=false
